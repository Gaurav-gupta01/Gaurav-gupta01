<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <div class="card mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <!-- <h5 class="mb-0" id="formTitle">Add detail</h5> -->
                <small id="editModeIndicator" class="badge bg-warning text-dark d-none">Edit Mode</small>
            </div>
            <div class="card-body">
                <form id="studentForm" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Name</label>
                        <input type="text" id="Name" class="form-control" required/>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Roll No</label>
                        <input type="text" id="rollno" class="form-control" required />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Class</label>
                        <input type="text" id="Class" class="form-control" required/>
                    </div>
                    <div class="col-12 text-end">
                        </button>
                        <button type="submit" id="submitBtn" class="btn btn-success">
                            submit
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Student List</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>sr</th>
                            <th>Name</th>
                            <th>Roll No</th>
                            <th>Class</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
<script src="main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

    crossorigin="anonymous"></script>

</html>
